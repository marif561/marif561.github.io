  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById("theme");
      function cur() {
        return root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }
      btn.addEventListener("click", function () {
        var n = cur() === "dark" ? "light" : "dark";
        root.dataset.theme = n;
        try { localStorage.setItem("theme", n); } catch (e) {}
      });
      document.querySelectorAll(".bib-btn").forEach(function (b) {
        b.addEventListener("click", function () {
          var pre = b.closest(".pub").querySelector(".bib");
          pre.hidden = !pre.hidden;
          b.setAttribute("aria-expanded", String(!pre.hidden));
        });
      });
      document.querySelectorAll(".filter button").forEach(function (b) {
        b.addEventListener("click", function () {
          document.querySelectorAll(".filter button").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          var f = b.dataset.f;
          document.querySelectorAll(".pub").forEach(function (p) {
            p.hidden = f !== "all" && p.dataset.t !== f;
          });
          document.querySelectorAll(".year-group").forEach(function (g) {
            g.hidden = !g.querySelector(".pub:not([hidden])");
          });
        });
      });
    })();
  </script>
